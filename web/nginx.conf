# DDoS 防护：连接和请求速率限制（已禁用）
# limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
# limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
# limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;
# limit_conn_status 429;
# limit_req_status 429;

server {
    # default_server：容器 healthcheck / localhost 等无匹配 Host 的请求落到本块（真实应用）。
    listen 80 default_server;
    # www 与主域共用本块，行为完全一致：API 路径与 Web 前端对两个域名都直接服务，不做 301。
    # SEO 归一化交给每页的 <link rel="canonical"> 指向主域（见 web 前端 Seo 组件），
    # 无需 www→主域 301——之前的全站 301 会打断不跟随重定向的 API 客户端，已废弃。
    server_name your-domain.com your-domain.com;

    # 真实客户端 IP：宿主机 nginx 已在 X-Forwarded-For 透传真实 IP，
    # 这里用 realip 模块把 $remote_addr 重写为 XFF 末端的真实客户端 IP，
    # 随后 proxy_set_header X-Real-IP $remote_addr 才能把真实 IP 传给 backend。
    # 信任网段覆盖 Docker bridge (172.16.0.0/12) 与常见内网测试网段。
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # DDoS 防护：每个 IP 最多 10 个并发连接（已禁用）
    # limit_conn conn_limit_per_ip 10;

    # DDoS 防护：连接超时优化，快速释放恶意连接
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 100;

    # DDoS 防护：请求大小限制（支付回调除外，需要 64k）
    client_max_body_size 10m;
    client_header_buffer_size 1k;

    # 支付宝同步回跳 URL 很长；HTTP/2 下 :path 默认约 4KB，不足时浏览器表现为 ERR_CONNECTION_CLOSED。
    # 公网 HTTPS 若在宿主机 Nginx 终止，必须在 443 的 server/http 里同样加大（见 host-nginx-https.example.conf）。
    large_client_header_buffers 4 64k;

    root /usr/share/nginx/html;
    index index.html;

    # SEO：压缩文本资源（百度移动友好度 / LCP）
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;

    # 旧链接迁移：图片功能已独立到 image.your-domain.com，分发出去的旧 URL 301 到子域
    location = /image-login {
        return 301 https://image.your-domain.com/login;
    }
    location = /image {
        return 301 https://image.your-domain.com/image;
    }

    # Vite 内容哈希产物：长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # 入口 HTML 不缓存（每次协商），保证发版即时生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # DDoS 防护：认证端点严格限流（登录/注册/发送验证码）
    location ~ ^/api/(login|register|sms/send|reset-password)$ {
        # limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://llm-gateway:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Proxy API requests to gateway backend (含支付宝异步 POST /api/payment/alipay/notify)
    location /api/ {
        # limit_req zone=req_limit_per_ip burst=20 nodelay;
        proxy_pass http://llm-gateway:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # OpenAPI spec served by the gateway
    location = /openapi.yaml {
        # limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://llm-gateway:9090;
        proxy_set_header Host $host;
    }

    # DDoS 防护：公开 LLM API 端点限流
    location /v1/ {
        # limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://llm-gateway:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        # SSE support
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    # Proxy Gemini native API requests to gateway
    location /gemini/ {
        # limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://llm-gateway:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        # SSE support
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    # Proxy image API requests to gateway
    location /v3/ {
        # limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://llm-gateway:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    # DDoS 防护：健康检查限制为内网访问
    location /health {
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://llm-gateway:9090;
    }

    # Proxy TOS image downloads to avoid CORS issues
    location /tos-proxy/ {
        proxy_pass https://your-tos-bucket.tos-cn-beijing.volces.com/;
        proxy_set_header Host your-tos-bucket.tos-cn-beijing.volces.com;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_cache off;
        add_header Access-Control-Allow-Origin $http_origin;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }

    # Legacy admin JSON (与 vite dev proxy 一致；需优先于 SPA)
    location = /admin/config {
        proxy_pass http://llm-gateway:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /admin/status {
        proxy_pass http://llm-gateway:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 安全：拦截 .env / .git 等点开头隐藏文件的扫描探测，直接 404 且不记日志。
    # 静态根只有前端 dist，本无这些文件；显式 404 避免 SPA 兜底返回 200 让扫描器误判命中。
    location ~ /\. {
        deny all;
        access_log off;
        return 404;
    }

    # 预渲染首页（SEO，scripts/prerender.mjs 产物）：存在时优先，缺失回退 SPA 壳
    location = / {
        try_files /__prerendered/index.html /index.html;
    }

    # SPA fallback — must be last
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 图片站独立子域：image.your-domain.com
# 与主域共用同一份 SPA dist 与同一个 backend；前端通过 window.location.hostname 在路由层分流。
server {
    listen 80;
    server_name image.your-domain.com;

    # 真实客户端 IP（与主域同配置，详见主域块注释）
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # DDoS 防护：每个 IP 最多 10 个并发连接（已禁用）
    # limit_conn conn_limit_per_ip 10;

    # DDoS 防护：连接超时优化
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 100;

    # DDoS 防护：请求大小限制
    client_max_body_size 10m;
    client_header_buffer_size 1k;

    large_client_header_buffers 4 64k;

    root /usr/share/nginx/html;
    index index.html;

    # SEO：图片站是密钥登录的私有站，禁止收录；不暴露主域的 sitemap
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location = /sitemap.xml {
        return 404;
    }

    # 图片密钥登录 / 退出 / me
    location /api/ {
        # limit_req zone=req_limit_per_ip burst=20 nodelay;
        proxy_pass http://llm-gateway:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # OpenAI 兼容 LLM API（图片站前端不直接用，但保留给从子域携带子域 cookie 的密钥访问）
    location /v1/ {
        # limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://llm-gateway:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    # 图片生成 API
    location /v3/ {
        # limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://llm-gateway:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    # DDoS 防护：健康检查限制为内网访问
    location /health {
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://llm-gateway:9090;
    }

    # TOS 图片下载代理（与主域同步，避免 CORS）
    location /tos-proxy/ {
        proxy_pass https://your-tos-bucket.tos-cn-beijing.volces.com/;
        proxy_set_header Host your-tos-bucket.tos-cn-beijing.volces.com;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_cache off;
        add_header Access-Control-Allow-Origin $http_origin;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }

    # 安全：同主域，拦截 .env / .git 等隐藏文件探测
    location ~ /\. {
        deny all;
        access_log off;
        return 404;
    }

    # SPA fallback — must be last
    location / {
        try_files $uri $uri/ /index.html;
    }
}
