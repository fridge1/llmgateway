# 宿主机 Nginx 终止 HTTPS 时粘贴用（勿直接 include，按证书路径修改）
# 支付宝「电脑网站支付」同步回跳会在 /balance 后附带很长 query（sign 等）。
# 默认 HTTP/2 下 :path 约 4KB 上限，超限会表现为 Chrome ERR_CONNECTION_CLOSED。
# 必须在「对外 443」这一层增大缓冲（仅改 Docker 内 web 无效）。

server {
    listen 443 ssl;
    http2 on;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    server_name your-domain.com your-domain.com;

    large_client_header_buffers 4 64k;
    client_max_body_size 4m;

    # 支付宝异步通知：POST 表单到 /api/payment/alipay/notify，须能到达本机 80 → Docker web → llm-gateway
    # 开放平台「授权回调地址」与 config 里 notify_url 须与对外域名一致（含 www / https）
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }
}
