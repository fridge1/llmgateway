server {
    listen 80;
    server_name localhost;

    # 真实客户端 IP：本地测试可手动注入 X-Forwarded-For 模拟上游代理，
    # realip 模块把 $remote_addr 重写为 XFF 末端的真实 IP，传给 backend。
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    large_client_header_buffers 4 64k;

    root /usr/share/nginx/html;
    index index.html;

    # SEO：与生产 nginx.conf 保持一致（gzip + 静态资源缓存）
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 旧链接迁移：本地用 image.localhost 模拟生产子域 image.your-domain.com
    # 本地 docker-compose.local 把容器 80 映射到主机 3000，所以这里硬编码 :3000
    location = /image-login {
        return 301 http://image.localhost:3000/login;
    }
    location = /image {
        return 301 http://image.localhost:3000/image;
    }

    # Proxy API requests to gateway backend
    location /api/ {
        proxy_pass http://backend:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2g;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # OpenAPI spec served by the gateway
    location = /openapi.yaml {
        proxy_pass http://backend:9090;
        proxy_set_header Host $host;
    }

    # Proxy LLM API requests to gateway
    location /v1/ {
        proxy_pass http://backend:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2g;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        # SSE support
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    # Proxy Gemini native API requests to gateway
    location /gemini/ {
        proxy_pass http://backend:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2g;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        # SSE support
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    # Proxy image API requests to gateway
    location /v3/ {
        proxy_pass http://backend:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2g;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    location /health {
        proxy_pass http://backend:9090;
    }

    # Legacy admin JSON
    location = /admin/config {
        proxy_pass http://backend:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /admin/status {
        proxy_pass http://backend:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy TOS image requests to avoid CORS issues
    location /tos-proxy/ {
        proxy_pass https://your-tos-bucket.tos-cn-beijing.volces.com/;
        proxy_set_header Host your-tos-bucket.tos-cn-beijing.volces.com;
        proxy_ssl_server_name on;
    }

    # 预渲染首页（SEO，与生产 nginx.conf 一致）：存在时优先，缺失回退 SPA 壳
    location = / {
        try_files /__prerendered/index.html /index.html;
    }

    # SPA fallback — must be last
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 本地图片站：image.localhost（对应生产 image.your-domain.com）
# 用 hosts 文件加 "127.0.0.1 image.localhost"，浏览器访问 http://image.localhost:3000
server {
    listen 80;
    server_name image.localhost;

    # 真实客户端 IP（与主域同配置，详见主域块注释）
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    large_client_header_buffers 4 64k;

    root /usr/share/nginx/html;
    index index.html;

    # SEO：图片站禁止收录（与生产 nginx.conf 一致）
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location = /sitemap.xml {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2g;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /v1/ {
        proxy_pass http://backend:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2g;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    location /v3/ {
        proxy_pass http://backend:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2g;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    location /health {
        proxy_pass http://backend:9090;
    }

    location /tos-proxy/ {
        proxy_pass https://your-tos-bucket.tos-cn-beijing.volces.com/;
        proxy_set_header Host your-tos-bucket.tos-cn-beijing.volces.com;
        proxy_ssl_server_name on;
    }

    # SPA fallback — must be last
    location / {
        try_files $uri $uri/ /index.html;
    }
}
